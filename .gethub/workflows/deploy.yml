name: Deploy KIT Smart Attendance to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Replace the __PLACEHOLDER__ tokens in the HTML with your
      #    real Firebase config, pulled from GitHub repository secrets.
      #    ⚠️ Change "kit_smart_attendance.html" below to match the
      #    actual filename of your HTML file in this repo.
      - name: Inject Firebase config from secrets
        env:
const firebaseConfig = {
  apiKey: "AIzaSyCDcaXYIO-lDB_WJcyJrMCBG6ww9nRrY8w",
  authDomain: "smart-attendance-26e62.firebaseapp.com",
  projectId: "smart-attendance-26e62",
  storageBucket: "smart-attendance-26e62.firebasestorage.app",
  messagingSenderId: "421373704972",
  appId: "1:421373704972:web:98139ca74bcb3e62212729",
  measurementId: "G-WFJM11RJTV"
};
          FILE="kit_smart_attendance.html"
          sed -i "s#__FIREBASE_API_KEY__#${FIREBASE_API_KEY}#g" "$FILE"
          sed -i "s#__FIREBASE_APPID__#${FIREBASE_APPID}#g" "$FILE"
          sed -i "s#__FIREBASE_AUTHDOMAIN__#${FIREBASE_AUTHDOMIN}#g" "$FILE"
          sed -i "s#__FIREBASE_MESSAGINGSENDERID__#${FIREBASE_MESSAGINGSENDERID}#g" "$FILE"
          sed -i "s#__FIREBASE_PROJECTID__#${FIREBASE_PROJECTID}#g" "$FILE"
          sed -i "s#__FIREBASE_STORAGEBUCKET__#${FIREBASE_STORAGEBUCKET}#g" "$FILE"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
