<!-- Lucide Icons -->

<!-- QR code generation (student ID card) + scanning (teacher attendance) -->

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword,
    createUserWithEmailAndPassword, signOut, updateProfile,
    GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, collection,
    query, where, getDocs, deleteDoc, updateDoc, arrayUnion
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ════════════════════════════════════════════════════════════
  //  FIREBASE CONFIG
  // ════════════════════════════════════════════════════════════
 const firebaseConfig = {
  apiKey: "AIzaSyCDcaXYIO-lDB_WJcyJrMCBG6ww9nRrY8w",
  authDomain: "smart-attendance-26e62.firebaseapp.com",
  projectId: "smart-attendance-26e62",
  storageBucket: "smart-attendance-26e62.firebasestorage.app",
  messagingSenderId: "421373704972",
  appId: "1:421373704972:web:98139ca74bcb3e62212729",
  measurementId: "G-WFJM11RJTV"
};

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();

  window._firebase = {
    auth, db, googleProvider,
    signInWithEmailAndPassword, createUserWithEmailAndPassword,
    signOut, updateProfile, signInWithPopup,
    sendPasswordResetEmail,
    doc, getDoc, setDoc, collection, query, where, getDocs, deleteDoc, updateDoc, arrayUnion
  };

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      window.currentUser = user;
      const fb = window._firebase;
      try {
        const snap = await fb.getDoc(fb.doc(fb.db, 'users', user.uid));
        window.currentUserRole = snap.exists() ? (snap.data().role || 'student') : 'student';
      } catch(e) { window.currentUserRole = 'student'; }

      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('appShell').style.display = 'block';
      updateHeaderUser(user);

      document.getElementById('teacherNav').style.display = 'none';
      document.getElementById('studentOnlyBtns').style.display = 'none';

      if (window.currentUserRole === 'teacher') {
        document.getElementById('teacherNav').style.display = 'flex';
        switchView('teacher');
      } else {
        document.getElementById('studentOnlyBtns').style.display = 'flex';
        switchView('student');
      }
      // Re-initialize icons after DOM updates
      if (typeof lucide !== 'undefined') lucide.createIcons();
    } else {
      window.currentUser = null;
      window.currentUserRole = null;
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('appShell').style.display = 'none';
    }
  });
</script>

<style>
:root {
  --ink: #0f172a;
  --ink-light: #1e293b;
  --paper: #f8fafc;
  --cream: #e2e8f0;
  --accent: #0d9488;
  --accent-hover: #0f766e;
  --accent2: #6366f1;
  --green: #10b981;
  --green-light: #d1fae5;
  --muted: #64748b;
  --border: #cbd5e1;
  --white: #ffffff;
  --shadow: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 6px -1px rgba(15,23,42,0.08), 0 2px 4px -2px rgba(15,23,42,0.05);
  --shadow-lg: 0 10px 15px -3px rgba(15,23,42,0.08), 0 4px 6px -4px rgba(15,23,42,0.05);
  --shadow-xl: 0 20px 25px -5px rgba(15,23,42,0.1), 0 8px 10px -6px rgba(15,23,42,0.05);
  --blue: #3b82f6;
  --red: #ef4444;
  --amber: #f59e0b;
  --google-red: #DB4437;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* Lucide icon sizing helpers */
.icon-inline { width: 16px; height: 16px; vertical-align: -2px; }
.icon-sm { width: 14px; height: 14px; }
.icon-md { width: 18px; height: 18px; vertical-align: -3px; }
.icon-lg { width: 20px; height: 20px; vertical-align: -4px; }

/* ════════ AUTH OVERLAY ════════ */
#authOverlay {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(135deg, #020617 0%, #0f172a 35%, #1e1b4b 100%);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.auth-card {
  background: white; border-radius: 20px;
  width: 440px; max-width: 100%;
  box-shadow: 0 24px 80px rgba(0,0,0,0.4);
  overflow: hidden;
  animation: slideUp 0.4s ease;
}
@keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }

.auth-card-header {
  background: linear-gradient(135deg, #0f172a, #312e81);
  padding: 28px 32px 24px;
  text-align: center;
  position: relative;
}
.auth-logo { width: 52px; height: 52px; border-radius: 12px; margin-bottom: 10px; background: rgba(255,255,255,0.1); }
.auth-card-header h1 { font-family:'Inter',sans-serif; font-weight:700; color:white; font-size:1.35rem; letter-spacing:-0.02em; }
.auth-card-header p { color:rgba(255,255,255,0.55); font-size:0.78rem; margin-top:4px; font-weight:400; }

.auth-role-picker {
  display: flex; gap: 0;
  background: rgba(255,255,255,0.08);
  border-radius: var(--radius); padding: 4px; margin: 16px auto 0;
  width: fit-content;
}
.role-btn {
  padding: 8px 22px; border: none; border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600;
  cursor: pointer; transition: all 0.25s; background: transparent; color: rgba(255,255,255,0.5);
  display: inline-flex; align-items: center; gap: 6px;
}
.role-btn.active { background: white; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

.auth-body { padding: 28px 32px 32px; }

.auth-tabs { display:flex; gap:4px; background:var(--cream); border-radius:10px; padding:4px; margin-bottom:22px; }
.auth-tab {
  flex:1; padding:8px; text-align:center; border:none;
  background:transparent; border-radius:7px;
  font-family:'Inter',sans-serif; font-size:0.85rem; font-weight:500;
  cursor:pointer; color:var(--muted); transition:all 0.2s;
}
.auth-tab.active { background:white; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,0.1); }

.auth-field { margin-bottom: 14px; }
.auth-field label { display:block; font-size:0.72rem; font-weight:700; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.06em; }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 44px !important; }
.pw-eye {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--muted);
  padding: 4px; font-size: 1rem; line-height:1; transition: color 0.2s;
  display: flex; align-items: center;
}
.pw-eye:hover { color: var(--ink); }
.auth-input {
  width: 100%; padding: 12px 16px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-family: 'Inter', sans-serif; font-size: 0.92rem;
  outline: none; transition: border-color 0.2s, box-shadow 0.2s; color: var(--ink);
}
.auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,0.1); }

.forgot-link { font-size:0.78rem; color:var(--accent); cursor:pointer; text-align:right; margin-top:4px; display:block; font-weight:500; }
.forgot-link:hover { text-decoration:underline; }

.auth-error { background:#fef2f2; color:var(--red); border:1px solid #fecaca; border-radius:var(--radius-sm); padding:10px 14px; font-size:0.82rem; margin-bottom:14px; display:none; }
.auth-error.show { display:flex; align-items:center; gap:8px; }
.auth-success { background:var(--green-light); color:#065f46; border:1px solid #a7f3d0; border-radius:var(--radius-sm); padding:10px 14px; font-size:0.82rem; margin-bottom:14px; display:none; }
.auth-success.show { display:flex; align-items:center; gap:8px; }

.btn-full { width:100%; justify-content:center; padding:13px; font-size:0.95rem; margin-bottom:10px; }
.btn-google {
  width:100%; padding:12px; border:1.5px solid var(--border); border-radius:10px;
  background:white; font-family:'Inter',sans-serif; font-size:0.88rem; font-weight:600;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
  transition:all 0.2s; color:var(--ink);
}
.btn-google:hover { background:var(--paper); border-color:#94a3b8; box-shadow:var(--shadow-md); }
.google-icon { width:18px; height:18px; }

.auth-divider { display:flex; align-items:center; gap:10px; margin:14px 0; color:var(--muted); font-size:0.78rem; }
.auth-divider::before, .auth-divider::after { content:''; flex:1; height:1px; background:var(--border); }

.librarian-note {
  background: #fef3c7; border: 1px solid #fde68a; border-radius: var(--radius-sm);
  padding: 10px 14px; font-size: 0.78rem; color: #92400e; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}

/* ════════ FORGOT PASSWORD PANEL ════════ */
#forgotPanel { display: none; }

/* ════════ APP SHELL ════════ */
#appShell { display: none; }

/* ── HEADER ── */
header {
  background: var(--ink); color: var(--white);
  padding: 0 40px; display: flex; align-items: center;
  justify-content: space-between; height: 64px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 0 rgba(255,255,255,0.06); gap: 16px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.header-left { display:flex; align-items:center; gap:14px; }
.header-logo { width:36px; height:36px; border-radius:8px; object-fit:cover; background:rgba(255,255,255,0.08); }
.header-title { font-family:'Inter',sans-serif; font-size:1.05rem; font-weight:700; letter-spacing:-0.02em; }
.header-sub { font-size:0.65rem; color:rgba(255,255,255,0.4); font-weight:400; letter-spacing:0.05em; text-transform:uppercase; }
.header-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }

.mode-toggle { display:flex; gap:4px; background:rgba(255,255,255,0.06); border-radius:var(--radius-sm); padding:3px; }
.mode-btn {

  font-family:'Inter',sans-serif; font-size:0.8rem; font-weight:500;

}
.mode-btn.active { background:rgba(255,255,255,0.12); color:white; }

.role-badge {
  padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600;

}
.role-badge.student { background: rgba(16,185,129,0.15); color: #34d399; }
.role-badge.teacher { background: rgba(99,102,241,0.15); color: #818cf8; }

/* User badge */
.user-badge-wrapper { position: relative; }
.user-badge {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.06); border-radius: var(--radius-sm);
  padding: 5px 12px 5px 6px; cursor: pointer; transition: background 0.2s;
  border: 1px solid rgba(255,255,255,0.06);
}
.user-badge:hover { background: rgba(255,255,255,0.1); }
.user-avatar {
  width:30px; height:30px; border-radius:50%;
  background:var(--accent); color:white;
  font-size:0.82rem; font-weight:600;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; flex-shrink:0;
}
.user-avatar img { width:100%; height:100%; object-fit:cover; }
.user-name { font-size:0.8rem; font-weight:500; color:white; max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.user-books-info { font-size:0.65rem; color:rgba(255,255,255,0.4); }

.user-dropdown {
  position:absolute; top:calc(100% + 8px); right:0;
  background:white; border:1px solid var(--border); border-radius:var(--radius);

}
.user-dropdown.open { display:block; }
.user-dropdown-header { padding:14px 16px; border-bottom:1px solid var(--border); }
.user-dropdown-email { font-size:0.75rem; color:var(--muted); margin-top:2px; }
.user-dropdown-item {
  padding:10px 16px; font-size:0.85rem; cursor:pointer;
  display:flex; align-items:center; gap:10px; transition:background 0.15s;
}
.user-dropdown-item:hover { background:var(--paper); }
.user-dropdown-item.danger { color:var(--red); }
.badge-count { background:var(--red); color:white; border-radius:20px; padding:1px 7px; font-size:0.7rem; font-weight:700; }

/* Install PWA button */
.install-btn {
  padding:6px 12px; border:1px solid rgba(255,255,255,0.15); border-radius:6px;
  background:transparent; color:rgba(255,255,255,0.6); font-family:'Inter',sans-serif;
  font-size:0.75rem; font-weight:500; cursor:pointer; transition:all 0.2s;
  display:flex; align-items:center; gap:6px; white-space:nowrap;
}
.install-btn:hover { background:rgba(255,255,255,0.08); color:white; border-color:rgba(255,255,255,0.3); }

/* ── MAIN ── */
main { padding:32px 40px; max-width:1300px; margin:0 auto; }
.view { display:none; }
.view.active { display:block; }

/* Student hero */
.student-hero {
  background:linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
  color:white; border-radius:var(--radius-lg); padding:32px 36px;
  margin-bottom:24px; position:relative; overflow:hidden;
  border: 1px solid rgba(255,255,255,0.06);
}
.student-hero::before { content:''; position:absolute; right:40px; top:50%; transform:translateY(-50%); width:80px; height:80px; background:rgba(255,255,255,0.03); border-radius:50%; }
.student-hero::after { content:''; position:absolute; right:80px; top:20%; width:120px; height:120px; background:rgba(99,102,241,0.08); border-radius:50%; filter:blur(40px); }
.student-hero h2 { font-family:'Inter',sans-serif; font-size:1.75rem; font-weight:700; margin-bottom:6px; letter-spacing:-0.02em; }
.student-hero p { color:rgba(255,255,255,0.5); font-size:0.88rem; font-weight:400; }
.search-bar-wrap { margin-top:20px; display:flex; gap:10px; }
.search-bar-wrap input {
  flex:1; padding:12px 16px; border:none; border-radius:var(--radius-sm);
  font-family:'Inter',sans-serif; font-size:0.9rem;
  background:rgba(255,255,255,0.08); color:white; outline:none;
  border: 1px solid rgba(255,255,255,0.08); transition: all 0.2s;
}
.search-bar-wrap input::placeholder { color:rgba(255,255,255,0.35); }
.search-bar-wrap input:focus { background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.15); }

.filter-bar { display:flex; gap:12px; margin-bottom:22px; flex-wrap:wrap; align-items:center; }
.filter-bar label { font-size:0.82rem; font-weight:500; color:var(--muted); }
.filter-select {
  padding:8px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
  font-family:'Inter',sans-serif; font-size:0.85rem; background:white;
  color:var(--ink); cursor:pointer; outline:none;
}
.filter-select:focus { border-color:var(--accent); }
.results-meta { font-size:0.82rem; color:var(--muted); margin-left:auto; font-family:'DM Mono',monospace; }

/* Book grid */
.book-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
.book-card {
  background:var(--white); border-radius:var(--radius); padding:20px;
  border:1px solid var(--border); transition:all 0.2s; position:relative;
}
.book-card:hover { border-color:var(--accent); box-shadow:var(--shadow-lg); transform:translateY(-1px); }
.book-card-shelf {
  position:absolute; top:16px; right:16px;
  background:var(--ink); color:white; font-family:'DM Mono',monospace;
  font-size:0.72rem; padding:3px 9px; border-radius:5px; font-weight:500;
}
.book-card-title { font-family:'Inter',sans-serif; font-weight:600; font-size:0.95rem; line-height:1.4; margin-bottom:6px; padding-right:50px; }
.book-card-author { font-size:0.82rem; color:var(--muted); margin-bottom:10px; font-weight:500; }
.book-card-genre { font-size:0.75rem; background:var(--cream); color:var(--ink); padding:3px 9px; border-radius:20px; display:inline-block; margin-bottom:12px; font-weight:500; }
.book-status {
  display:inline-flex; align-items:center; gap:5px;
  font-size:0.78rem; font-weight:600; padding:4px 10px; border-radius:20px;
}
.book-status.available { background:var(--green-light); color:#065f46; }
.book-status.issued { background:#fef3c7; color:#92400e; }
.book-status::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
.book-card-actions { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
.my-issued-tag { background:#eff6ff; color:var(--blue); font-size:0.72rem; font-weight:600; padding:2px 8px; border-radius:20px; display:inline-flex; align-items:center; gap:4px; }
.no-results { text-align:center; padding:60px 20px; color:var(--muted); grid-column:1/-1; }

/* My Books Panel */
.my-books-panel { background:white; border:1px solid var(--border); border-radius:var(--radius); padding:24px 28px; margin-bottom:28px; }
.my-books-panel h3 { font-size:1rem; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.my-book-item { display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--border); border-radius:10px; padding:12px 16px; margin-bottom:10px; }
.my-book-item-info { flex:1; }
.my-book-title { font-weight:600; font-size:0.88rem; }
.my-book-meta { font-size:0.75rem; color:var(--muted); margin-top:2px; }
.my-book-date { font-size:0.72rem; color:var(--muted); font-family:'DM Mono',monospace; }
.my-books-empty { color:var(--muted); font-size:0.88rem; text-align:center; padding:20px 0; }

/* Admin */
.admin-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:14px; }
.admin-header h2 { font-family:'Inter',sans-serif; font-size:1.5rem; font-weight:700; letter-spacing:-0.02em; }
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
.stat-card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; }
.stat-num { font-family:'Inter',sans-serif; font-size:1.85rem; font-weight:700; color:var(--ink); letter-spacing:-0.02em; }
.stat-label { font-size:0.75rem; color:var(--muted); margin-top:2px; font-weight:500; text-transform:uppercase; letter-spacing:0.06em; }

.admin-search-row { display:flex; gap:10px; margin-bottom:16px; align-items:center; flex-wrap:wrap; }
.admin-search-row input { flex:1; min-width:200px; padding:10px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:'Inter',sans-serif; font-size:0.88rem; outline:none; }
.admin-search-row input:focus { border-color:var(--accent); }

.table-wrap { background:white; border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; overflow-x:auto; }
table { width:100%; border-collapse:collapse; min-width:700px; }
thead th { background:var(--ink); color:white; padding:12px 16px; text-align:left; font-size:0.72rem;
